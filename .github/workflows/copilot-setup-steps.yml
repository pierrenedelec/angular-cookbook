name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/install-mdbook/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/install-mdbook/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: Install mdBook
        run: cargo install --force --version 0.4.52 mdbook
      - name: Install mdBook preprocessors
        uses: ./.github/workflows/install-mdbook
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
